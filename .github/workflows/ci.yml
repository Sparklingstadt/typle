name: CI

# Runs npm run verify (scripts/verify.cjs) on every pull request and on main: the same checks, in the same order, as on
# the developer's Mac, against a PostgreSQL of its own. Two things differ here. The screenshot snapshots
# (tests/e2e/screenshots.spec.ts) are skipped, as their images are taken on macOS and only match there; and the runner
# has fewer cores, so the end-to-end tests use fewer workers. The Release and the production deployment are not done
# here: they stay by hand, after npm run verify on the Mac (docs/release-workflow.md). No secret is used.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://typle:ci-only-password@127.0.0.1:5432/typle
      TYPLE_E2E_WORKERS: '4'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: typle
          POSTGRES_DB: typle
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U typle -d typle"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          # infra/ and api-docs/ are npm projects of their own; verify installs them when their node_modules is missing.
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json
            api-docs/package-lock.json
      - run: npm ci
      # The browser download is cached per Playwright version; the system packages it needs are installed every run.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run verify
      # The traces of the end-to-end tests that failed (playwright.config.ts keeps them on failure).
      - name: Keep the traces of failed end-to-end tests
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
