- main:
  - button "単語パック"
  - heading "パックを作成" [level=1]
  - paragraph: パックの情報を入力し、パックにまとめる単語リストを選びます。リストはあとから追加できます。
  - region "パックの情報":
    - text: パック名
    - textbox "パック名"
    - paragraph: パックの一覧と、練習するパックの選択に表示されます。
    - text: 説明（任意）
    - textbox "説明（任意）":
      - /placeholder: このパックの内容など
    - text: カテゴリ（任意）
    - combobox "カテゴリ（任意）": カテゴリを選ぶ
    - paragraph: 使っているカテゴリから1つ選ぶか、入力して新しく作成します。一覧や練習画面で絞り込めます。
    - text: タグ（任意）
    - combobox "タグ（任意）": タグを選ぶ・作成する
    - paragraph: 使っているタグから選ぶか、入力して新しく作成します（20個まで）。リスト名やタグでの検索に使えます。
  - region "単語リスト":
    - heading "単語リスト" [level=2]
    - text: 0件を選択中
    - paragraph: 選んだリストは、今入っているパックからこのパックへ移ります。リストがなくなったパックは削除されます。
    - searchbox "単語リストを名前で絞り込む"
    - list "単語リスト":
      - listitem:
        - checkbox "基本の単語"
        - text: 基本の単語 パック「英単語」 · 3語
      - listitem:
        - checkbox "よく使う表現"
        - text: よく使う表現 パック「英単語」 · 2語
  - text: 変更はありません
  - button "キャンセル"
  - button "保存"
