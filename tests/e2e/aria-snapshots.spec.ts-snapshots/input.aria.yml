- main:
  - heading "入力" [level=1]
  - paragraph: 練習で文字を入力するときの設定です。
  - region "特殊文字の簡易入力":
    - heading "特殊文字の簡易入力" [level=2]
    - paragraph: チェコ語やスペイン語などの í・ó・ñ・č のように、アクセントやティルダなどの記号が付いた文字を、記号のない文字（i・o・n・c）で入力できるようにします。記号付きの文字をそのまま入力しても正解になります。 ロシア語のキリル文字も、привет → privet、школа → shkola、я → ya のようにラテン文字で入力できます。キリル文字の直接入力も正解になります。
    - text: 特殊文字の簡易入力を使う ONにすると、á → a、č → c、ш → sh、я → ya のように入力できます。
    - switch "特殊文字の簡易入力を使う ONにすると、á → a、č → c、ш → sh、я → ya のように入力できます。"
    - status: この設定はこのブラウザーに保存されます。
  - region "大文字・小文字を区別しない":
    - heading "大文字・小文字を区別しない" [level=2]
    - paragraph: A と a のように、大文字と小文字を同じ文字として扱います。Shift キーを押さずに入力しても、押して入力しても正解になります。
    - text: 大文字・小文字を区別しない ONにすると、A や É などの大文字を a や é と入力しても正解になります（逆も同じです）。
    - switch "大文字・小文字を区別しない ONにすると、A や É などの大文字を a や é と入力しても正解になります（逆も同じです）。"
    - status: この設定はこのブラウザーに保存されます。
  - region "簡易入力の対応表":
    - heading "簡易入力の対応表" [level=2]
    - paragraph: 特殊文字の簡易入力をONにしたときに、それぞれの文字の代わりに入力できるキーです。
