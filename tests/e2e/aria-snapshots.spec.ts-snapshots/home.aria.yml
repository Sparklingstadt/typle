    - heading "苦手な単語" [level=2]
    - paragraph: リストごとに、直近10回の練習（Handwriting を除く）で間違えた単語を、間違えた回の多い順に表示します。苦手な単語だけの練習でミスなく打てた単語は、ここから外れます。
    - paragraph: まだ苦手な単語はありません。練習で間違えた単語がここに出ます。
